# fly.toml app configuration file generated for alpha-omega-xmd on 2026-10-24T17:53:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'alpha-omega-xmd'
primary_region = 'fra'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
