<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOLF XMD - SIMON LINK ENGINE</title>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:20px}
.card{background:#1a1a1a;padding:25px;border-radius:15px;width:100%;max-width:400px;border:1px solid #333}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #444;background:#000;color:#fff;box-sizing:border-box}
button{width:100%;padding:12px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
.code-box{background:#000;padding:15px;border-radius:8px;text-align:center;font-size:28px;letter-spacing:3px;margin:10px 0;border:1px dashed #00ff88;display:none}
.info{font-size:12px;color:#888;margin-top:10px;text-align:center}
.divider{height:1px;background:#333;margin:25px 0}
h3{margin:0 0 10px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h3>🐺 WOLF XMD PAIRING</h3>
<p style="text-align:center;font-size:12px;color:#aaa">SIMON MD ENGINE</p>

<!-- BOX 1: PAIR CODE -->
<input id="num" placeholder="239166265317 (no +)">
<button onclick="getCode()">Get Pair Code</button>
<div id="codeBox" class="code-box"></div>
<div id="msg1" class="info"></div>

<div class="divider"></div>

<!-- BOX 2: SAME DASHBOARD DEPLOY - AFTER LINK -->
<h3>📦 DEPLOY SESSION - SAME DASHBOARD</h3>
<input id="sess" placeholder="Paste WOLF~... session here">
<button onclick="deploySess()" style="background:#00aaff">DEPLOY - GO ONLINE FOREVER</button>
<div id="msg2" class="info"></div>
<p class="info">After linking, bot DM you WOLF~. Copy it and paste here. Then click Deploy. Bot will be online forever on same URL! No need Render ENV.</p>

</div>

<script>
async function getCode(){
  const n=document.getElementById('num').value.replace(/[^0-9]/g,'');
  if(n.length<10){ alert('Enter number'); return; }
  document.getElementById('msg1').innerText='Getting code... wait 5 sec';
  try{
    const r=await fetch('/getcode?number='+n);
    const j=await r.json();
    if(j.code){
      document.getElementById('codeBox').style.display='block';
      document.getElementById('codeBox').innerText=j.code;
      document.getElementById('msg1').innerText='Enter this in WhatsApp > Linked Devices > Link with phone number - FAST! 60 sec';
    }else{
      document.getElementById('msg1').innerText=j.message||j.error||'Failed, wait 5 sec retry';
    }
  }catch(e){ document.getElementById('msg1').innerText='Error: '+e.message; }
}

async function deploySess(){
  const s=document.getElementById('sess').value.trim();
  if(!s.startsWith('WOLF~')){ alert('Session must start with WOLF~'); return; }
  document.getElementById('msg2').innerText='Deploying...';
  try{
    const r=await fetch('/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:s})});
    const j=await r.json();
    if(j.success){
      document.getElementById('msg2').innerText='✅ DEPLOYED! Restarting bot... Wait 10 sec then check /api/status - Bot will be ONLINE forever!';
      // Auto reload status after 5 sec
      setTimeout(()=>{ fetch('/api/status').then(r=>r.json()).then(d=>{ document.getElementById('msg2').innerText='Status: '+d.status+' | Connected: '+d.isConnected; }); }, 5000);
    }else{
      document.getElementById('msg2').innerText='Error: '+(j.error||'failed');
    }
  }catch(e){ document.getElementById('msg2').innerText='Error '+e.message; }
}

// Auto fetch session from /check-session after linking
setInterval(async()=>{
  try{
    const r=await fetch('/check-session');
    const j=await r.json();
    if(j.session && !document.getElementById('sess').value){
      document.getElementById('sess').value=j.session;
      document.getElementById('msg2').innerText='✅ Session auto-detected! Click DEPLOY now!';
    }
  }catch{}
}, 3000);
</script>
</body>
  </html>
